name: Bot

# Manual trigger only. This workflow mints a short-lived installation token for
# the BlendMax GitHub App and commits/pushes as <app-slug>[bot], so automated
# changes carry a distinguishable identity instead of a personal account.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to commit to
        required: true
        default: main
      message:
        description: Commit message
        required: true
        default: "chore: automated update"

# The default GITHUB_TOKEN is not used for the push; permissions are declared
# here only so the checkout step and any PR creation stay explicit.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commit:
    name: Commit as the BlendMax App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          # A personal token must never be used to push here, otherwise the
          # commit is attributed to that person instead of the App.
          persist-credentials: false

      - name: Mint an installation token for the App
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Configure git to author as the App
        run: |
          SLUG="${{ steps.app-token.outputs.app-slug }}"
          git config user.name "${SLUG}[bot]"
          git config user.email "${SLUG}[bot]@users.noreply.github.com"

      # ---- Replace this step with the actual change you want automated. ----
      - name: Make a change
        run: |
          echo "Automated update by the BlendMax App at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> BOT_LOG.md

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "${{ inputs.message }}"
          git push "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git" \
            "HEAD:${{ inputs.branch }}"
